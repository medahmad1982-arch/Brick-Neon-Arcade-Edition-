
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d1b">
<title>Brick Neon - Arcade</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

#app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  position: relative;
  background:
    radial-gradient(ellipse at top, #142449 0%, #080d1b 65%);
}

header {
  width: 100%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 4px 15px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #00f5ff;
  text-shadow: 0 0 15px #00eaff;
}

.stats {
  display: flex;
  gap: 13px;
  text-align: center;
}

.stat-label {
  font-size: 9px;
  color: #8798bc;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 17px;
  font-weight: bold;
  margin-top: 3px;
}

#gameContainer {
  flex: 1;
  width: 100%;
  max-width: 500px;
  min-height: 0;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  border: 1px solid rgba(0, 238, 255, .2);
  border-radius: 13px;
  background: linear-gradient(180deg, #0a1530, #080d1b);
  box-shadow: 0 0 25px rgba(0, 225, 255, .08);
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(5, 10, 25, .88);
  backdrop-filter: blur(8px);
  border-radius: 13px;
  padding: 20px;
}

.panel {
  width: 100%;
  max-width: 310px;
  text-align: center;
}

.panel h1 {
  font-size: 35px;
  font-weight: 900;
  color: #00f5ff;
  text-shadow: 0 0 25px #00d9ff;
  margin-bottom: 10px;
}

.panel p {
  color: #9aabc9;
  font-size: 13px;
  line-height: 1.8;
  margin-bottom: 22px;
}

button {
  border: 0;
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #06111e;
  background: linear-gradient(90deg, #00f5ff, #00b9ff);
  box-shadow: 0 0 25px rgba(0, 220, 255, .35);
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.secondary {
  margin-top: 10px;
  background: #182847;
  color: white;
  box-shadow: none;
}

#bottom {
  width: 100%;
  max-width: 500px;
  display: flex;
  justify-content: space-between;
  padding: 12px 5px 5px;
  color: #8496b8;
  font-size: 11px;
}

#bottom span {
  color: #00eaff;
}

.hidden {
  display: none !important;
}

@media (max-height: 550px) {
  header { padding: 3px 4px 6px; }
  .logo { font-size: 18px; }
  #bottom { padding: 4px; }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">BRICK NEON</div>

  <div class="stats">
    <div>
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div>
      <div class="stat-label">RECORD</div>
      <div class="stat-value" id="best">0</div>
    </div>
    <div>
      <div class="stat-label">VIES</div>
      <div class="stat-value" id="lives">❤️❤️❤️</div>
    </div>
  </div>
</header>

<div id="gameContainer">

  <canvas id="game"></canvas>

  <div class="overlay" id="home">
    <div class="panel">
      <h1>BRICK<br>NEON</h1>
      <p>
        Détruis les briques.<br>
        Attrape les bonus.<br>
        Survis le plus longtemps possible !
      </p>
      <button id="play">JOUER</button>
      <p style="margin-top:18px;font-size:11px">
        GLISSE TON DOIGT POUR CONTRÔLER LA RAQUETTE
      </p>
    </div>
  </div>

  <div class="overlay hidden" id="pause">
    <div class="panel">
      <h1>PAUSE</h1>
      <p>La partie est suspendue.</p>
      <button id="resume">REPRENDRE</button>
      <button class="secondary" id="restart">RECOMMENCER</button>
    </div>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="panel">
      <h1>GAME OVER</h1>
      <p id="finalScore">Score : 0</p>
      <button id="again">REJOUER</button>
      <button class="secondary" id="homeBtn">ACCUEIL</button>
    </div>
  </div>

</div>

<div id="bottom">
  <div>NIVEAU <span id="level">1</span></div>
  <div id="status">ARCADE MODE</div>
  <div>NEON EDITION</div>
</div>

</div>

<script>
(() => {
"use strict";

// =============================
// CONFIGURATION
// =============================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

const W = 400;
const H = 700;

let scaleX = 1;
let scaleY = 1;

let running = false;
let paused = false;
let gameStarted = false;

let score = 0;
let best = Number(localStorage.getItem("brickNeonBest")) || 0;
let lives = 3;
let level = 1;

$("best").textContent = best;

// =============================
// AUDIO SYNTHÉTIQUE
// =============================

let audio = null;
let muted = false;

function initAudio() {
  if (!audio) {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    if (AudioContext) audio = new AudioContext();
  }

  if (audio && audio.state === "suspended") {
    audio.resume();
  }
}

function sound(freq, duration, type = "square", volume = .045) {
  if (!audio || muted) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, audio.currentTime);

  gain.gain.setValueAtTime(volume, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime + duration);
}

function brickSound() {
  sound(420 + Math.random() * 300, .09, "square");
}

function powerSound() {
  sound(300, .15, "sine");
  setTimeout(() => sound(650, .2, "sine"), 100);
}

// =============================
// TAILLE DU CANVAS
// =============================

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));

  scaleX = canvas.width / W;
  scaleY = canvas.height / H;

  ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
}

window.addEventListener("resize", resize);
resize();

// =============================
// VARIABLES DU JEU
// =============================

const paddle = {
  x: 160,
  y: 650,
  w: 80,
  h: 12,
  target: 200,
  speed: 12
};

let balls = [];
let bricks = [];
let particles = [];
let capsules = [];

let shake = 0;

let wideTimer = 0;
let powerfulTimer = 0;

let lastTime = 0;
let animationId = 0;

// =============================
// INITIALISATION
// =============================

function createBall(x, y, vx, vy, powerful = false) {
  return {
    x, y,
    vx, vy,
    r: 7,
    powerful,
    trail: []
  };
}

function resetBall() {
  balls = [
    createBall(W / 2, 610, 3.2, -4.7)
  ];
}

function createLevel() {
  bricks = [];

  const rows = Math.min(4 + Math.floor(level / 2), 9);
  const cols = 8;

  const margin = 13;
  const gap = 5;
  const brickW = (W - margin * 2 - gap * (cols - 1)) / cols;
  const brickH = 20;

  const colors = [
    "#00eaff",
    "#00ff99",
    "#a855f7",
    "#ff3f9f",
    "#ffb52e",
    "#ff5252"
  ];

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {

      if (Math.random() < .08 && row > 0) continue;

      bricks.push({
        x: margin + col * (brickW + gap),
        y: 65 + row * (brickH + 8),
        w: brickW,
        h: brickH,
        color: colors[(row + level) % colors.length],
        hp: level > 3 && Math.random() < .2 ? 2 : 1
      });
    }
  }
}

function startGame() {
  initAudio();

  cancelAnimationFrame(animationId);

  score = 0;
  lives = 3;
  level = 1;

  paddle.w = 80;
  paddle.x = 160;
  paddle.target = 200;

  wideTimer = 0;
  powerfulTimer = 0;

  particles = [];
  capsules = [];

  createLevel();
  resetBall();

  $("home").classList.add("hidden");
  $("pause").classList.add("hidden");
  $("gameover").classList.add("hidden");

  running = true;
  paused = false;
  gameStarted = true;

  updateUI();

  lastTime = performance.now();
  animationId = requestAnimationFrame(loop);
}

// =============================
// INTERFACE
// =============================

function updateUI() {
  $("score").textContent = score;
  $("best").textContent = best;
  $("lives").textContent =
    "❤️".repeat(lives) + "🖤".repeat(3 - lives);

  $("level").textContent = level;

  $("status").textContent =
    powerfulTimer > 0 ? "POWER BALL" :
    wideTimer > 0 ? "WIDE PADDLE" :
    "ARCADE MODE";
}

function addScore(points) {
  score += points;

  if (score > best) {
    best = score;
    localStorage.setItem("brickNeonBest", best);
  }

  updateUI();
}

// =============================
// PARTICULES
// =============================

function explosion(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      size: 2 + Math.random() * 3,
      color
    });
  }

  shake = Math.max(shake, 3);
}

function updateParticles(dt) {
  const factor = dt / 16.67;

  for (const p of particles) {
    p.x += p.vx * factor;
    p.y += p.vy * factor;
    p.vx *= Math.pow(.97, factor);
    p.vy *= Math.pow(.97, factor);
    p.life -= .025 * factor;
  }

  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// =============================
// BONUS
// =============================

function dropCapsule(x, y) {
  if (Math.random() > .19) return;

  const types = ["wide", "multi", "power"];

  const type = types[Math.floor(Math.random() * 3)];

  capsules.push({
    x, y,
    r: 11,
    vy: 2,
    type,
    color:
      type === "wide" ? "#00eaff" :
      type === "multi" ? "#b35cff" :
      "#ffb52e"
  });
}

function activateBonus(type) {
  powerSound();

  if (type === "wide") {
    wideTimer = 600;
    paddle.w = 125;
  }

  if (type === "power") {
    powerfulTimer = 500;

    for (const b of balls) {
      b.powerful = true;
    }
  }

  if (type === "multi") {
    const original = balls[0];

    if (original) {
      for (let i = 0; i < 2; i++) {
        balls.push(
          createBall(
            original.x,
            original.y,
            i === 0 ? -4 : 4,
            original.vy,
            original.powerful
          )
        );
      }
    }
  }

  updateUI();
}

function updateCapsules(dt) {
  const factor = dt / 16.67;

  for (const c of capsules) {
    c.y += c.vy * factor;

    if (
      c.y + c.r >= paddle.y &&
      c.y - c.r <= paddle.y + paddle.h &&
      c.x >= paddle.x &&
      c.x <= paddle.x + paddle.w
    ) {
      activateBonus(c.type);
      c.collected = true;
    }
  }

  capsules = capsules.filter(c => !c.collected && c.y < H + 20);
}

function drawCapsules() {
  const symbols = {
    wide: "↔",
    multi: "×3",
    power: "★"
  };

  for (const c of capsules) {
    ctx.save();

    ctx.shadowColor = c.color;
    ctx.shadowBlur = 15;

    ctx.fillStyle = c.color;

    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#08101f";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(symbols[c.type], c.x, c.y);

    ctx.restore();
  }
}

// =============================
// DESSIN
// =============================

function drawBackground() {
  ctx.fillStyle = "#080f23";
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(0,220,255,.045)";
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 25) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += 25) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawBricks() {
  for (const b of bricks) {
    ctx.save();

    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 4);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 2);

    if (b.hp > 1) {
      ctx.fillStyle = "#07101d";
      ctx.font = "bold 11px Arial";
      ctx.textAlign = "center";
      ctx.fillText("2", b.x + b.w / 2, b.y + 14);
    }

    ctx.restore();
  }
}

function drawPaddle() {
  ctx.save();

  const gradient = ctx.createLinearGradient(
    paddle.x, 0,
    paddle.x + paddle.w, 0
  );

  gradient.addColorStop(0, "#00aaff");
  gradient.addColorStop(.5, "#00faff");
  gradient.addColorStop(1, "#00aaff");

  ctx.fillStyle = gradient;
  ctx.shadowColor = "#00eaff";
  ctx.shadowBlur = 22;

  ctx.beginPath();
  ctx.roundRect(
    paddle.x,
    paddle.y,
    paddle.w,
    paddle.h,
    7
  );
  ctx.fill();

  ctx.restore();
}

function drawBalls() {
  for (const b of balls) {
    ctx.save();

    b.trail.push({x: b.x, y: b.y});

    if (b.trail.length > 7) b.trail.shift();

    b.trail.forEach((p, i) => {
      ctx.globalAlpha = i / b.trail.length * .3;
      ctx.fillStyle = b.powerful ? "#ffb52e" : "#ffffff";

      ctx.beginPath();
      ctx.arc(p.x, p.y, b.r * (i + 1) / 8, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;

    ctx.fillStyle = b.powerful ? "#ffb52e" : "#ffffff";
    ctx.shadowColor = b.powerful ? "#ffb52e" : "#00f5ff";
    ctx.shadowBlur = 18;

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function draw() {
  ctx.save();

  if (shake > 0) {
    ctx.translate(
      (Math.random() - .5) * shake,
      (Math.random() - .5) * shake
    );
  }

  drawBackground();
  drawBricks();
  drawPaddle();
  drawBalls();
  drawCapsules();
  drawParticles();

  ctx.restore();
}

// =============================
// COLLISIONS
// =============================

function ballRectCollision(ball, rect) {
  const closestX = Math.max(
    rect.x,
    Math.min(ball.x, rect.x + rect.w)
  );

  const closestY = Math.max(
    rect.y,
    Math.min(ball.y, rect.y + rect.h)
  );

  const dx = ball.x - closestX;
  const dy = ball.y - closestY;

  if (dx * dx + dy * dy > ball.r * ball.r) {
    return false;
  }

  const overlapX = Math.min(
    Math.abs(ball.x - rect.x),
    Math.abs(ball.x - (rect.x + rect.w))
  );

  const overlapY = Math.min(
    Math.abs(ball.y - rect.y),
    Math.abs(ball.y - (rect.y + rect.h))
  );

  if (overlapX < overlapY) {
    ball.vx *= -1;
  } else {
    ball.vy *= -1;
  }

  return true;
}

function updateBalls(dt) {
  const factor = dt / 16.67;
  const speedMultiplier = 1 + (level - 1) * .055;

  for (const b of balls) {

    const speed = speedMultiplier;

    b.x += b.vx * speed * factor;
    b.y += b.vy * speed * factor;

    // Murs latéraux
    if (b.x < b.r) {
      b.x = b.r;
      b.vx = Math.abs(b.vx);
      sound(220, .05);
    }

    if (b.x > W - b.r) {
      b.x = W - b.r;
      b.vx = -Math.abs(b.vx);
      sound(220, .05);
    }

    // Mur supérieur
    if (b.y < b.r) {
      b.y = b.r;
      b.vy = Math.abs(b.vy);
      sound(250, .05);
    }

    // Raquette
    if (
      b.vy > 0 &&
      b.y + b.r >= paddle.y &&
      b.y - b.r <= paddle.y + paddle.h &&
      b.x >= paddle.x - b.r &&
      b.x <= paddle.x + paddle.w + b.r
    ) {
      b.y = paddle.y - b.r;

      const hit = (
        (b.x - (paddle.x + paddle.w / 2)) /
        (paddle.w / 2)
      );

      const speedNow = Math.hypot(b.vx, b.vy);

      const angle = hit * 1.05;

      b.vx = Math.sin(angle) * speedNow;
      b.vy = -Math.abs(Math.cos(angle) * speedNow);

      sound(520, .07, "triangle");
    }

    // Briques
    let hitBrick = false;

    for (let i = bricks.length - 1; i >= 0; i--) {
      const brick = bricks[i];

      if (ballRectCollision(b, brick)) {

        brick.hp--;

        if (brick.hp <= 0) {
          explosion(
            brick.x + brick.w / 2,
            brick.y + brick.h / 2,
            brick.color
          );

          dropCapsule(
            brick.x + brick.w / 2,
            brick.y + brick.h / 2
          );

          bricks.splice(i, 1);
          addScore(10 * level);
        } else {
          shake = Math.max(shake, 2);
        }

        brickSound();

        if (b.powerful && brick.hp <= 0) {
          // La balle puissante traverse la brique détruite.
          b.vy = -Math.abs(b.vy);
        }

        hitBrick = true;
        break;
      }
    }

    if (hitBrick) continue;
  }

  // Retirer les balles perdues
  balls = balls.filter(b => b.y < H + 30);

  if (balls.length === 0) {
    loseLife();
  }
}

// =============================
// VIES ET NIVEAUX
// =============================

function loseLife() {
  lives--;

  updateUI();

  sound(150, .3, "sawtooth");

  if (lives <= 0) {
    endGame();
    return;
  }

  balls = [
    createBall(W / 2, 610, 3.2, -4.7)
  ];

  paddle.x = (W - paddle.w) / 2;
  paddle.target = W / 2;
}

function nextLevel() {
  level++;

  sound(600, .2, "sine");

  createLevel();

  balls = [
    createBall(W / 2, 610, 3.2, -4.7)
  ];

  capsules = [];

  updateUI();
}

function endGame() {
  running = false;

  $("finalScore").textContent =
    "Score : " + score + " | Record : " + best;

  $("gameover").classList.remove("hidden");
}

// =============================
// MISE À JOUR
// =============================

function update(dt) {
  const factor = dt / 16.67;

  // Mouvement fluide de la raquette
  paddle.x += (
    paddle.target - paddle.w / 2 - paddle.x
  ) * Math.min(1, .35 * factor);

  paddle.x = Math.max(
    0,
    Math.min(W - paddle.w, paddle.x)
  );

  updateBalls(dt);
  updateCapsules(dt);
  updateParticles(dt);

  if (wideTimer > 0) {
    wideTimer -= factor;

    if (wideTimer <= 0) {
      paddle.w = 80;
      wideTimer = 0;
    }
  }

  if (powerfulTimer > 0) {
    powerfulTimer -= factor;

    if (powerfulTimer <= 0) {
      powerfulTimer = 0;
      balls.forEach(b => b.powerful = false);
    }
  }

  if (bricks.length === 0 && running) {
    nextLevel();
  }

  shake *= Math.pow(.86, factor);

  updateUI();
}

// =============================
// BOUCLE DU JEU
// =============================

function loop(time) {
  if (!running || paused) return;

  const dt = Math.min(time - lastTime, 33);
  lastTime = time;

  update(dt);
  draw();

  animationId = requestAnimationFrame(loop);
}

// =============================
// CONTRÔLE TACTILE / SOURIS
// =============================

function movePaddle(clientX) {
  const rect = canvas.getBoundingClientRect();

  const relativeX =
    (clientX - rect.left) / rect.width * W;

  paddle.target = relativeX;
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  movePaddle(e.clientX);
});

canvas.addEventListener("pointermove", e => {
  e.preventDefault();

  if (e.pointerType === "mouse" || e.buttons > 0 || e.pointerType === "touch") {
    movePaddle(e.clientX);
  }
});

// Empêcher le défilement sur mobile
document.addEventListener("touchmove", e => {
  e.preventDefault();
}, {passive: false});

// =============================
// BOUTONS
// =============================

$("play").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("restart").addEventListener("click", startGame);

$("resume").addEventListener("click", () => {
  initAudio();

  paused = false;
  running = true;

  $("pause").classList.add("hidden");

  lastTime = performance.now();
  animationId = requestAnimationFrame(loop);
});

$("homeBtn").addEventListener("click", () => {
  running = false;
  paused = false;

  $("gameover").classList.add("hidden");
  $("home").classList.remove("hidden");
});

$("app").addEventListener("dblclick", e => {
  e.preventDefault();
});

// Touche Échap pour pause
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && running) {
    paused = true;
    running = false;

    cancelAnimationFrame(animationId);

    $("pause").classList.remove("hidden");
  }
});

// Dessin initial
draw();

})();
</script>

</body>
</html>
